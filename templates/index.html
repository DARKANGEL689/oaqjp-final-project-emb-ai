<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emotion Detector</title>
</head>
<body>
    <h1>Emotion Detector</h1>
    <label for="textToAnalyze">Enter text to analyze:</label>
    <input type="text" id="textToAnalyze" placeholder="Type a sentence">
    <button onclick="runEmotionDetection()">Analyze</button>
    <p id="system_response"></p>

    <script>
        async function runEmotionDetection() {
            const text = document.getElementById("textToAnalyze").value;
            const output = document.getElementById("system_response");

            try {
                const response = await fetch(
                    "/emotionDetector?textToAnalyze=" + encodeURIComponent(text)
                );
                const result = await response.text();
                output.textContent = result;
            } catch (error) {
                output.textContent = "Unable to connect to the emotion detector.";
            }
        }
    </script>
</body>
</html>
